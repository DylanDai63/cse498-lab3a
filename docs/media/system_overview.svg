<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 975" width="1500" height="975" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#222222"/></marker></defs>
<rect x="0" y="0" width="1500" height="975" fill="#ffffff"/>
<text x="40" y="56" font-size="36" font-weight="700" fill="#1f2328">Your object detector inside the TurtleBot3 semantic-navigation stack</text>
<text x="40" y="88" font-size="17" fill="#5c6570">Map first, query later: the robot builds a semantic map while it explores, then drives to any mapped object by name.</text>
<g transform="translate(0,12)">
<rect x="40" y="100" width="460" height="395" fill="#fdf6d6" stroke="#e6d9a2" stroke-width="1.5"/>
<text x="54" y="129" font-size="17" font-weight="700" fill="#1f2328">① Autonomous exploration</text>
<rect x="58" y="150" width="330" height="44" rx="22.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="223.0" y="177.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2328">Robot spawns in an unknown room</text>
<rect x="58" y="220" width="330" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="223.0" y="247.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">SLAM Toolbox</text>
<text x="223.0" y="270.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">LiDAR + odometry → map + pose</text>
<rect x="58" y="312" width="330" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="223.0" y="339.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Frontier detection</text>
<text x="223.0" y="362.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">nearest unexplored edge</text>
<rect x="58" y="404" width="330" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="223.0" y="431.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Nav2</text>
<text x="223.0" y="454.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">drives the robot there</text>
<path d="M223,194 L223,217" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M223,286 L223,309" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M223,378 L223,401" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M388,437 L410,437 L410,345 L391,345" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="417" y="386.3" text-anchor="start" font-size="14.5" font-weight="400" fill="#1f2328">keep</text>
<text x="417" y="405.9" text-anchor="start" font-size="14.5" font-weight="400" fill="#1f2328">exploring</text>
<rect x="525" y="100" width="450" height="395" fill="#fdf6d6" stroke="#e6d9a2" stroke-width="1.5"/>
<text x="539" y="129" font-size="17" font-weight="700" fill="#1f2328">② Perception while exploring</text>
<rect x="553" y="150" width="394" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="750.0" y="177.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Camera frame</text>
<text x="750.0" y="200.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">a new view as the robot moves</text>
<rect x="553" y="244" width="394" height="112" rx="12" fill="#0f766e"/>
<text x="750" y="280.4" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Object detector</text>
<text x="750" y="307.4" text-anchor="middle" font-size="15.5" font-weight="700" fill="#bff3ea">you implement this node</text>
<text x="750" y="334.4" text-anchor="middle" font-size="16.5" font-weight="400" fill="#e6fffb">YOLO26n → labelled 2D boxes</text>
<rect x="553" y="384" width="394" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="750.0" y="411.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Boxes + labels</text>
<text x="750.0" y="434.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">person, trash can, chair</text>
<path d="M750,216 L750,241" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M750,356 L750,381" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M500,183 L550,183" fill="none" stroke="#222222" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="526" y="157.1" text-anchor="middle" font-size="13" font-weight="400" fill="#5c6570">new</text>
<text x="526" y="172.1" text-anchor="middle" font-size="13" font-weight="400" fill="#5c6570">views</text>
<rect x="1000" y="100" width="460" height="395" fill="#fdf6d6" stroke="#e6d9a2" stroke-width="1.5"/>
<text x="1014" y="129" font-size="17" font-weight="700" fill="#1f2328">③ Localization &amp; semantic memory</text>
<rect x="1025" y="150" width="410" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="1230.0" y="177.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Camera–LiDAR localizer</text>
<text x="1230.0" y="200.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">box bearing + LiDAR range → (x, y)</text>
<rect x="1025" y="242" width="410" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="1230.0" y="269.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Short-term memory</text>
<text x="1230.0" y="292.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">same object across frames → one ID</text>
<rect x="1025" y="334" width="410" height="96" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="1230.0" y="364.5" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Landmark memory</text>
<text x="1230.0" y="388.1" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">confirmed after repeated sightings,</text>
<text x="1230.0" y="411.8" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">pinned to the map with the SLAM pose</text>
<path d="M1230,216 L1230,239" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M1230,308 L1230,331" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M947,417 L988,417 L988,183 L1022,183" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="210" y="530" width="1250" height="295" fill="#fdf6d6" stroke="#e6d9a2" stroke-width="1.5"/>
<text x="224" y="559" font-size="17" font-weight="700" fill="#1f2328">④ Query the map and go</text>
<text x="115" y="620.9" text-anchor="middle" font-size="14" font-weight="400" fill="#5c6570">typed any time</text>
<rect x="40" y="630" width="150" height="56" rx="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="115.0" y="653.3" text-anchor="middle" font-size="16.5" font-weight="400" fill="#1f2328">Command:</text>
<text x="115.0" y="674.3" text-anchor="middle" font-size="16.5" font-weight="400" fill="#1f2328">go to X</text>
<polygon points="500,598 615,658 500,718 385,658" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="500" y="652.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">X already a</text>
<text x="500" y="675.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">landmark?</text>
<rect x="665" y="625" width="280" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="805.0" y="652.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Approach pose</text>
<text x="805.0" y="675.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">0.5 m stand-off, facing X</text>
<rect x="980" y="625" width="240" height="66" rx="10" fill="#e4def7" stroke="#5b4bc4" stroke-width="1.6"/>
<text x="1100.0" y="652.3" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">Nav2 NavigateToPose</text>
<text x="1100.0" y="675.9" text-anchor="middle" font-size="17.5" font-weight="400" fill="#1f2328">exploration paused</text>
<rect x="1255" y="630" width="195" height="56" rx="28.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="1352.5" y="653.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2328">TARGET_REACHED</text>
<text x="1352.5" y="674.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2328">exploration resumes</text>
<rect x="330" y="750" width="340" height="58" rx="29.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="500.0" y="774.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2328">not on the map yet:</text>
<text x="500.0" y="795.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1f2328">keep exploring, ask again later</text>
<path d="M190,658 L382,658" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M615,658 L662,658" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M945,658 L977,658" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M1220,658 L1252,658" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M500,718 L500,747" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="640" y="646" text-anchor="middle" font-size="15" fill="#1f2328">yes</text>
<text x="512" y="739" text-anchor="start" font-size="15" fill="#1f2328">no</text>
<path d="M1230,430 L1230,512 L500,512 L500,595" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="776.0" y="503" width="178.0" height="22" fill="#ffffff"/>
<text x="865" y="518" text-anchor="middle" font-size="15" fill="#1f2328">landmarks on the map</text>
<path d="M1352,686 L1352,852 L115,852 L115,689" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="581.0" y="843" width="304.0" height="22" fill="#ffffff"/>
<text x="733" y="858" text-anchor="middle" font-size="15" fill="#1f2328">next command reuses the same memory</text>
</g>
<text x="40" y="922" font-size="15.5" fill="#5c6570">You implement one node, the object detector. Everything else is provided: SLAM, exploration, localization, memory, command parsing and Nav2 (ROS 2 Humble, Gazebo Classic).</text>
<text x="40" y="950" font-size="15.5" fill="#5c6570">What you take away: how a neural detector runs inside a live ROS 2 robot, and how a 2D box becomes a place on the map the robot can drive to.</text>
</svg>